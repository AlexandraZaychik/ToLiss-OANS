# Read by the native plugin. Reload via Plugins > ToLiss OANS > Reload config.
stand_name=simple
# pink_vertical (default), pink_horizontal, yellow_vertical, yellow_horizontal
cursor=pink_vertical
# Optional yellow current runway / taxiway / stand row, off by default.
stus_bar=0
# Scale buttons replace wheel zoom when enabled; off by default.
scale_button=0
nd_enabled=1
test_pattern=0
# Legacy INI values: 0=[silent] basic, 1=[annoy] mcdu trigger, 2=[a bit] light trigger.
# Menu labels do not change the legacy INI mapping for existing configurations.
# Passive INIT FROM/TO and ALTN reads never navigate MCDU2 and remain enabled in all modes.
# With light: beacon/both landing lights OFF->ON; one attempt plus two retries, 5s apart.
# With light retains INIT reads; disables engine/phase and F-PLN/SEC key triggers.
# First valid reading establishes a baseline. Zibo direct DataRef reads ignore this setting.
fms_mcdu2_sampling=0
# Optional airport traffic receiver. Toggle in Setting > ADS-B IN.
adsb_in=0
# Close both ToLiss / LR A330 OANS overlays on ECAM 4->5; off by default.
close_when_takeoff=0

# Pavement fill / brown boundary detail: ultra, max, xhigh, high, medium (default), low.
detail_quality=medium

# Menu language: auto follows X-Plane (Chinese -> Chinese, all others -> English).
# Manual choices: english / chinese. Missing or invalid values also use auto.
language=auto
