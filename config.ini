# Read by the native plugin. Reload via Plugins > ToLiss OANS > Reload config.
stand_name=simple
# pink_vertical (default), pink_horizontal, yellow_vertical, yellow_horizontal
cursor=pink_vertical
# Optional yellow current runway / taxiway / stand row, off by default.
stus_bar=0
nd_enabled=1
test_pattern=0
# MCDU2 screen automation only; off by default. Zibo direct DataRef reads ignore this setting.
fms_mcdu2_sampling=0
# Optional airport traffic receiver. Toggle in Setting > ADS-B IN.
adsb_in=0
# Close both ToLiss / LR A330 OANS overlays on ECAM 4->5; off by default.
close_when_takeoff=0
